[package]
name = "candle-qwen"
version.workspace = true
edition.workspace = true
description = "CPU-only Qwen2 quantized inference library built on Candle"
license.workspace = true
publish = false

[lib]
name = "candle_qwen"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
# Enable the Hugging Face Hub download path (`Qwen::from_hugging_face`). Off by
# default: the on-device build loads local files (`Qwen::from_files`), and the
# download path pulls in `ureq` + `native-tls` + `openssl-sys`, which does not
# cross-compile to Android without a vendored OpenSSL sysroot.
download = ["dep:hf-hub"]

[dependencies]
anyhow = { workspace = true }
candle = { workspace = true }
candle-transformers = { workspace = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, features = ["onig"] }
